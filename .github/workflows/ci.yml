name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check server.js
      - name: Build image
        run: docker build -t htb-machine-finder .
      - name: Smoke test
        run: |
          docker run -d --name finder -p 8787:8787 htb-machine-finder
          for i in $(seq 1 15); do curl -fs http://127.0.0.1:8787/healthz && exit 0; sleep 1; done
          docker logs finder; exit 1
